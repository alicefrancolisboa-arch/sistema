name: Build Concurso Saltinho APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aloha-casa-do-acai/concurso-saltinho/**'
      - '.github/workflows/concurso-saltinho-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && unzip -q gradle-8.10.2-bin.zip
      - name: Build debug APK
        working-directory: aloha-casa-do-acai/concurso-saltinho
        run: ../../gradle-8.10.2/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ConcursoSaltinho-debug-apk
          path: aloha-casa-do-acai/concurso-saltinho/app/build/outputs/apk/debug/app-debug.apk

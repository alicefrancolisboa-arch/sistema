name: Gerar APK Aloha
on:
  push:
    paths: ['aloha-casa-do-acai/android/**', 'aloha-casa-do-acai/static/mobile.css', 'aloha-casa-do-acai/templates/index.html']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle e gerar APK
        working-directory: aloha-casa-do-acai/android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aloha-Casa-do-Acai-APK
          path: aloha-casa-do-acai/android/app/build/outputs/apk/debug/app-debug.apk

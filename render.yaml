services:
  - type: web
    name: saidas-mary
    runtime: node
    plan: 0.5c-512mb
    branch: saidas-mary
    rootDir: saidas-mary
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - saidas-mary/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/saidas-mary
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_PASSWORD
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
    disk:
      name: saidas-mary-dados
      mountPath: /var/data
      sizeGB: 1

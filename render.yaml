services:
  - type: web
    name: saidas-mary
    runtime: node
    plan: free
    branch: saidas-mary
    rootDir: saidas-mary
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - saidas-mary/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_DRIVER
        value: turso
      - key: TURSO_DATABASE_URL
        value: libsql://saidas-mary-casadoacai.aws-eu-west-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_PASSWORD
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

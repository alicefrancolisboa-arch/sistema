services:
  - type: web
    name: aloha-casa-do-acai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: dados-acai
      mountPath: /opt/render/project/src/data
      sizeGB: 1

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><title>Concurso Saltinho</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><span>AVANÇASP · SALTINHO 2026</span><h1>Concurso Saltinho</h1><p>Simulados orientados pelo edital</p></header><section id="home" class="card"><h2>Escolha seu cargo</h2><button data-cargo="sanitario"><strong>Agente Sanitário</strong><small>100% conhecimentos específicos</small></button><button data-cargo="merendeira"><strong>Merendeira</strong><small>Português e Matemática/Raciocínio Lógico</small></button><button class="secondary" id="errors">Revisar erros</button></section><section id="setup" class="card hidden"><button class="back">← Voltar</button><h2 id="role-title"></h2><p id="role-description"></p><label>Quantidade de questões <select id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option></select></label><label>Dificuldade <select id="difficulty"><option value="facil">Fácil</option><option value="media" selected>Média</option><option value="dificil">Difícil</option></select></label><button id="start">Iniciar simulado</button></section><section id="quiz" class="card hidden"></section><section id="review" class="card hidden"><button class="back">← Voltar</button><h2>Caderno de erros</h2><div id="error-list"></div></section><footer>Questões por IA são inéditas. Confirme sempre o edital e as normas oficiais.</footer></main><script src="/app.js"></script></body></html>

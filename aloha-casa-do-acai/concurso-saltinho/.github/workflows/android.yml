name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Download Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && unzip -q gradle-8.10.2-bin.zip
      - name: Build debug APK
        run: ./gradle-8.10.2/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ConcursoSaltinho-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }

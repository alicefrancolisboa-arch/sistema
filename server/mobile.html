:root{font-family:system-ui,sans-serif;color:#193f38;background:#f3f7f3;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:22px 20px 105px}header small{font-size:11px;letter-spacing:2px;color:#087f73;font-weight:800}h1{font-size:29px;line-height:1.12;margin:10px 0 8px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0}p{line-height:1.5;color:#62756e;font-size:14px;margin:9px 0}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:14px 17px;font-weight:700;cursor:pointer;background:#087f73;color:#fff;min-height:48px;box-shadow:0 4px 0 #076659}button:disabled{opacity:.5;cursor:wait}button.alt{background:#e6f1ea;color:#176558;box-shadow:0 3px 0 #d3e4d9}button.danger{background:#8e3939;box-shadow:0 3px 0 #632929}.card{background:white;border-radius:22px;padding:22px;margin-top:17px;box-shadow:0 4px 0 #e2ece6}.hero{background:#086f63;color:white}.hero p{color:#dcf0e5}.hero .big{font-size:50px;font-weight:800;margin:13px 0}.hero progress{width:100%;height:12px;accent-color:#f5be56}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{width:100%}.tag{background:#fff2d5;color:#735312;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700}.badge{background:#e9f2ed;color:#29634d;padding:6px 11px;border-radius:20px;font-size:12px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cadbd2;border-radius:11px;background:#fbfdfb;color:#193f38}input[type=checkbox]{width:22px;height:22px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:5px;padding:10px 6px 18px;border-top:1px solid #e1ece4}nav button{background:none;box-shadow:none;color:#75877b;font-size:12px;padding:11px 14px}nav button.active{background:#e5f2e9;color:#086f63}#notice{position:sticky;top:0;z-index:3;background:#fff1cd;color:#674d0e;padding:13px 18px;font-size:14px;display:none}dialog{border:0;border-radius:22px;padding:25px;max-width:440px;width:calc(100% - 30px);color:#193f38}dialog::backdrop{background:#102f2877}.empty{text-align:center;padding:15px}.spacer{margin-top:17px}.code{font:700 29px ui-monospace,monospace;letter-spacing:3px;text-align:center;color:#087f73}button:focus-visible,input:focus-visible{outline:3px solid #f4b942;outline-offset:3px}.muted{color:#647b6e;font-size:13px}footer{margin-top:22px;font-size:12px;color:#7a897e}@media(min-width:600px){.children{display:grid;grid-template-columns:1fr 1fr;gap:16px}.children .card{margin-top:0}}

145deg,#ff6975,#bf2635);border:1px solid #ff8a9355;box-shadow:0 7px 0 #741520,0 13px 18px #0007}.tag{background:linear-gradient(145deg,#443717,#2a230f);color:#ffd476;border:1px solid #705b2f;box-shadow:0 4px 0 #171203,inset 0 1px #fff2}.badge{background:#123e60;color:#87caff;border:1px solid #285979}.row{row-gap:16px}.grid{gap:18px}input,select{background:#07131d;color:#f4f9ff;border:1px solid #264359;box-shadow:inset 0 3px 9px #0007}label{color:#9ab2c2}input[type=checkbox]{accent-color:#b9f36b;box-shadow:none}nav{overflow-x:auto;justify-content:space-evenly}nav button{flex-shrink:0}nav{background:linear-gradient(155deg,#091621,#040a10);border-top:1px solid #294b62;box-shadow:0 -8px 30px #0008;padding-bottom:18px}nav button{background:transparent;color:#9eb8cb;box-shadow:none;border:1px solid transparent}nav button.active{background:linear-gradient(145deg,#183c57,#0a2031);color:#79bdff;border-color:#305b78;box-shadow:0 5px 0 #030a0f,0 10px 18px #0008,inset 0 1px #ffffff20}dialog{background:linear-gradient(145deg,#132736,#091722);color:#f4f9ff;border:1px solid #31556e;box-shadow:0 14px 0 #01070b,0 30px 70px #000d,inset 0 1px #fff2;max-height:88vh;overflow:auto}dialog::backdrop{background:#01060bd6;backdrop-filter:blur(6px)}.code{color:#b9f36b}#notice{background:#153926;color:#eaffed;border-bottom:1px solid #49765a;box-shadow:0 8px 20px #0007}.app-options{max-height:210px;overflow:auto}.app-options label{overflow-wrap:anywhere}.children{margin-top:25px;gap:26px}@media(max-width:420px){main{padding-left:14px;padding-right:14px}.card{padding:19px}h1{font-size:28px}.hero .big{font-size:46px}.row>button{flex:1 1 135px}.grid{gap:10px}nav button{padding:11px 10px}.crest-logo{width:52px;height:57px}}
</style></head><body><div id="notice" role="status"></div><main><header><div class="brand"><img class="crest-logo" src="/crest.jpg" alt="Brasão da Família Borges Franco"><div><b>Borges Franco</b><small>TEMPO DE CRESCER</small></div></div><h1 id="title">Crescer, juntos.</h1><p id="subtitle">Carregando seu painel…</p></header><div id="content"></div><footer>Os bônus valem no dia da aprovação. Descanso continua protegido.</footer></main><nav id="nav"></nav><dialog id="modal"></dialog><script>
'use strict';
let seq=0,pending=new Map(),model=null,children=[],view='today',working=false;
const $=id=>document.getElementById(id),escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function native(action,data={}){return new Promise((resolve,reject)=>{const id=String(++seq);const timer=setTimeout(()=>{pending.delete(id);reject(Error('O servidor demorou a responder. Tente novamente.'));},95000);pending.set(id,{resolve,reject,timer});if(!window.FamilyNative){clearTimeout(timer);pending.delete(id);reject(Error('Abra este painel dentro do aplicativo Android.'));return;}window.FamilyNative.call(id,action,JSON.stringify(data));});}
window.nativeReply=r=>{const p=pending.get(r.id);if(!p)return;clearTimeout(p.timer);pending.delete(r.id);r.ok?p.resolve(r.data):p.reject(Error(r.error));};
function tell(message){$('notice').textContent=message;$('notice').style.display=message?'block':'none';}
function mins(ms){const n=Math.max(0,Math.floor((ms||0)/60000));return n>=60?`${Math.floor(n/60)}h ${n%60}min`:`${n} min`;}
function time(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function parseTime(v){const [h,m]=v.split(':').map(Number);return h*60+m;}
function when(n){return n?new Date(n).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'ainda não conectado';}
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function state(){return model.state?.day===day()?model.state:{...model.state,bonus:0,used:0,claims:{}};}
async function run(fn){if(working)return;working=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){tell(e.message);}finally{working=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function refresh(){const fresh=await native('sync');model=fresh;if(model.role==='parent')children=(await native('/api/parent/list')).children;tell('');render();}
function update(r){if(r.config)model.config=r.config;if(r.state)model.state=r.state;if(r.childId)model.childId=r.childId;if(r.name)model.name=r.name;model.lastSync=Date.now();}
function button(label,action,data='',css=''){return `<button class="${css}" data-action="${action}" data-id="${escape(data)}">${escape(label)}</button>`;}
function render(){if(!model)return;const isParent=model.role==='parent';$('subtitle').textContent=(isParent?'Responsável • ':'Meu perfil • ')+model.name;$('title').textContent=({today:'Tempo para tudo.',children:'Aparelhos e perfis.',reports:'Relatórios da família.',tasks:'Conquistas do dia.',settings:'Cuidar e acompanhar.'})[view];const tabs=[['today','Hoje'],...(isParent?[['children','Aparelhos'],['reports','Relatórios']]:[]),['tasks','Tarefas'],['settings','Configurações']];$('nav').innerHTML=tabs.map(([id,label])=>button(label,'tab',id,id===view?'active':'')).join('');
 const s=state(),c=model.config||{};let html='';
 if(view==='today'){const limit=(c.limit||0)+(s.bonus||0);html=`<section class="card hero"><img class="hero-crest" src="/crest.jpg" alt=""><div class="row between"><b>${escape(model.name)}</b><span class="tag">+${s.bonus||0} min em bônus</span></div><div class="big">${mins(Math.max(0,limit*60000-(s.used||0)))}</div><p>disponíveis nos aplicativos controlados</p><progress max="${Math.max(1,limit)}" value="${Math.min(limit,(s.used||0)/60000)}"></progress><p>Usado: ${mins(s.used)} · Total do dia: ${limit} min</p>${c.blocked?'<p>Pausa manual definida pelo responsável.</p>':!c.enabled?'<p>Controle pausado pelo responsável.</p>':''}</section><section class="card"><h2>Uma conquista de cada vez</h2><p>Conclua suas tarefas e ganhe tempo extra após a aprovação do responsável.</p>${button('Ver tarefas','tab','tasks','wide')}</section><section class="card"><div class="row between"><h2>Conexão</h2><span class="badge">${escape(when(model.lastSync))}</span></div><p>Dados da última atualização. Sem internet, novas regras e bônus aguardam conexão.</p>${devices(s)}${button('Atualizar agora','sync','','alt wide')}</section>`;}
 if(view==='children'){html=`<section class="card"><h2>Cada criança, seu próprio ritmo</h2><p>Os limites e bônus são separados por perfil. Toque na criança para administrar suas regras.</p><div class="row">${button('+ Adicionar criança','pair')}${button('Atualizar lista','list','','alt')}</div></section><div class="children spacer">${children.map(child=>`<section class="card"><h2>${escape(child.name)}</h2><p>${mins(child.state.used)} usados hoje · +${child.state.bonus} min de bônus</p>${devices(child.state)}${button('Administrar perfil','select',child.id,'wide')}</section>`).join('')}</div>${model.childId?`<section class="card"><h2>Mais um aparelho</h2><p>Vincule um segundo celular ou tablet ao perfil atual: <b>${escape(model.name)}</b>. O tempo será somado entre os aparelhos quando conectados.</p>${button('+ Aparelho para este perfil','pair-existing','','alt wide')}</section>`:''}`;}
 if(view==='tasks'){html=`<section class="card"><h2>Tarefas de ${escape(model.name)}</h2><p>A criança pede o bônus. O responsável confere e aprova. Cada tarefa rende uma vez por dia.</p>${button('+ Configurar nova tarefa','new-task','','wide')}</section>`;const tasks=c.tasks||[];if(!tasks.length)html+='<section class="card empty"><h2>Vamos começar?</h2><p>Cadastre uma tarefa e escolha quantos minutos ela vale.</p></section>';html+=tasks.map(t=>{const status=s.claims?.[t.id];return `<section class="card"><div class="row between"><h2>${escape(t.title)}</h2><span class="tag">+${t.minutes} min</span></div><p>${({pending:'Aguardando aprovação',approved:'✓ Bônus liberado hoje',rejected:'Refaça a tarefa e solicite novamente'})[status]||'Disponível hoje'}</p><div class="row">${!isParent&&!['approved','pending'].includes(status)?button('Concluí • pedir bônus','claim',t.id):''}${status==='pending'?button('Aprovar bônus','approve',t.id)+button('Pedir para refazer','reject',t.id,'alt'):''}${button('Editar tarefa','edit-task',t.id,'alt')}</div></section>`;}).join('');}
 if(view==='settings'){html=`<section class="card"><h2>Regras de ${escape(model.name)}</h2><p>${c.blocked?"Pausa manual ativa.":"Sem bloqueio manual."}</p><div class="row">${button("Bloquear agora","block","","danger")}${button("Liberar bloqueio manual","unblock","","alt")}</div><div class="row spacer">${button("Liberação especial","release")}${button("Encerrar liberação","end-release","","alt")}</div><p>${releaseLabel(c.release)}</p><form id="rules"><label for="limit">Tempo diário em minutos</label><input id="limit" name="limit" type="number" min="1" max="1440" required value="${c.limit}"><label class="row"><input name="enabled" type="checkbox" ${c.enabled?'checked':''}>Controle ativo</label><label class="row"><input name="rest" type="checkbox" ${c.rest?'checked':''}>Ativar horário de descanso</label><div class="grid"><div><label for="start">Começa</label><input id="start" name="start" type="time" required value="${time(c.start)}"></div><div><label for="end">Termina</label><input id="end" name="end" type="time" required value="${time(c.end)}"></div></div><button class="wide spacer" type="submit">Salvar com PIN do responsável</button></form><p>Aplicativos e permissões são configurados no aparelho da criança, em Ajustes do aparelho.</p></section>${isParent?`<section class="card"><h2>Dois adultos, a mesma família</h2><p>Gere um convite para o outro responsável. No celular dele, escolha modo Responsável e “Entrar em família existente”. Use o PIN definido para os responsáveis da família.</p>${button('Convidar outro responsável','invite','','wide')}</section>`:''}<section class="card"><h2>Atualizações automáticas</h2><p>As telas e funções deste painel são recebidas do servidor e verificadas antes de abrir. A última versão válida continua disponível sem internet.</p>${button('Buscar atualização do painel','update','','alt wide')}<p>Alterações nas permissões e no serviço de bloqueio do Android ainda precisam de uma nova versão do APK.</p></section>`;}
 if(isParent&&!model.childId&&view!=='children'&&view!=='reports')html='<section class="card"><h2>Seu painel está pronto</h2><p>Comece em Aparelhos para vincular os celulares das crianças. Cada perfil terá seu tempo, suas tarefas e seus bônus.</p>'+button('Adicionar primeiro aparelho','pair','','wide')+'</section>';
 if(view==='reports')html=reports();
 const picker=isParent?'<section class="card"><label for="profile">Perfil da criança</label><select id="profile"><option value="">Selecione um perfil</option>'+children.map(child=>'<option value="'+escape(child.id)+'" '+(child.id===model.childId?'selected':'')+'>'+escape(child.name)+'</option>').join('')+'</select><p>Tempo, tarefas e configurações se aplicam ao perfil selecionado.</p></section>':'';
 $('content').innerHTML=picker+html;}
function reports(){
 if(!children.length)return '<section class="card"><h2>Relatórios</h2><p>Os relatórios aparecerão após vincular os aparelhos. Nenhum dado de uso foi recebido ainda.</p>'+button('Vincular aparelho','pair','','wide')+'</section>';
 return '<section class="card"><h2>Acompanhamento por criança</h2><p>Uso dos aplicativos controlados, limite diário, bônus e tarefas aprovadas. O histórico começa com os dados recebidos pelo servidor; dias sem registros não representam uso zero. São guardados os últimos 30 dias registrados.</p></section>'+children.map(child=>{const rows=[{day:child.state.day,used:child.state.used,bonus:child.state.bonus,limit:child.config.limit,approved:Object.values(child.state.claims||{}).filter(v=>v==='approved').length},...(child.history||[]).slice().reverse()];return '<section class="card"><h2>'+escape(child.name)+'</h2><div style="overflow:auto"><table style="width:100%;text-align:left;border-spacing:0 14px"><thead><tr><th>Dia</th><th>Uso</th><th>Limite</th><th>Bônus</th><th>Aprovadas</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+escape(r.day)+'</td><td>'+mins(r.used)+'</td><td>'+r.limit+' min</td><td>+'+r.bonus+' min</td><td>'+r.approved+'</td></tr>').join('')+'</tbody></table></div>'+devices(child.state)+button('Configurar este perfil','select',child.id,'alt wide')+'</section>';}).join('');
}
document.addEventListener('change',e=>{if(e.target.id==='profile'&&e.target.value)run(async()=>{update(await native('select',{childId:e.target.value}));render();tell('Perfil selecionado.');});});
function devices(s){return(s.devices||[]).map(d=>`<p><b>${escape(d.name)}</b> · ${mins(d.used)}<br><span class="muted">${escape(when(d.lastSeen))} · ${d.guardEnabled?'bloqueio ativo':'bloqueio não confirmado'}</span></p>`).join('');}
function dialog(html){$('modal').innerHTML=html+`<div class="spacer">${button('Fechar','close','','alt wide')}</div>`;$('modal').showModal();}
function taskDialog(id){const task=(model.config.tasks||[]).find(t=>t.id===id)||{id:'',title:'',minutes:15};dialog(`<h2>${id?'Editar tarefa':'Nova tarefa'}</h2><form id="task" data-id="${escape(task.id)}"><label for="taskTitle">O que precisa fazer?</label><input id="taskTitle" name="title" maxlength="80" required value="${escape(task.title)}"><label for="taskMinutes">Bônus em minutos</label><input id="taskMinutes" name="minutes" type="number" min="1" max="240" required value="${task.minutes}"><button type="submit" class="wide spacer">Salvar com PIN</button></form>${id?button('Excluir tarefa','delete-task',id,'danger wide spacer'):''}`);}
function pairDialog(existing){dialog(`<h2>${existing?'Adicionar aparelho':'Adicionar criança'}</h2><form id="pair" data-existing="${existing}"><label for="name">Nome da criança</label><input id="name" name="name" required maxlength="80" value="${existing?escape(model.name):''}" ${existing?'readonly':''}><label for="device">Nome do aparelho</label><input id="device" name="deviceName" required maxlength="80" placeholder="Ex.: tablet"><label for="code">Código gerado no aparelho da criança</label><input id="code" name="code" required maxlength="10" autocomplete="off"><button type="submit" class="wide spacer">Vincular com PIN</button></form>`);}

function releaseLabel(r){if(!r||r.until>0&&r.until<=Date.now())return 'Sem liberação especial ativa.';return (r.all?'Todos os aplicativos controlados':r.apps.map(p=>model.config.appLabels?.[p]||p).join(', '))+' liberados '+(r.until===0?'até o responsável encerrar.':'até '+when(r.until)+'.');}
function releaseDialog(){dialog('<h2>Liberação especial</h2><p>Escolha o alcance e a duração. Durante a liberação, os aplicativos escolhidos ignoram o limite e o descanso. As regras anteriores voltam ao final.</p><form id="release"><label for="scope">O que liberar?</label><select id="scope" name="scope"><option value="all">Todos os aplicativos controlados</option><option value="apps">Somente os aplicativos marcados abaixo</option></select><div class="app-options">'+(model.config.apps||[]).map(p=>'<label class="row"><input type="checkbox" name="apps" value="'+escape(p)+'">'+escape(model.config.appLabels?.[p]||p)+'</label>').join('')+'</div><label for="releaseMinutes">Por quantos minutos?</label><input id="releaseMinutes" type="number" name="minutes" value="30" min="1" max="1440" required><label class="row"><input type="checkbox" name="indefinite">Sem prazo: até eu encerrar</label><button class="wide spacer" type="submit">Confirmar com PIN do responsável</button></form>');}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='login'){boot();return;}if(a==='close'){$('modal').close();return;}if(a==='release'){releaseDialog();return;}if(a==='new-task'||a==='edit-task'){taskDialog(id);return;}if(a==='pair'||a==='pair-existing'){pairDialog(a==='pair-existing');return;}
 run(async()=>{if(a==='tab'){if(id==='children'||id==='reports'){const r=await native('/api/parent/list');children=r.children;}view=id;render();return;}
 if(a==='sync'){await refresh();return;}if(a==='list'){children=(await native('/api/parent/list')).children;render();return;}
 if(a==='select'){update(await native('select',{childId:id}));view='settings';tell('');render();return;}
 if(['claim','approve','reject'].includes(a)){update(await native('/api/'+(a==='claim'?'child/':'parent/')+a,{taskId:id,childId:model.childId}));render();tell(a==='approve'?'Bônus aprovado. O aparelho da criança recebe na próxima sincronização.':'Tarefa atualizada.');return;}
 if(a==='delete-task'){const c={...model.config,tasks:model.config.tasks.filter(t=>t.id!==id)};update(await native('/api/parent/config',{config:c,childId:model.childId}));$('modal').close();render();return;}
 if(a==='block'||a==='unblock'){update(await native('/api/parent/block',{childId:model.childId,blocked:a==='block'}));render();tell(a==='block'?'Bloqueio solicitado. Aguarde a sincronização do aparelho.':'Bloqueio manual liberado. Limites e descanso continuam valendo.');return;}
 if(a==='end-release'){update(await native('/api/parent/release',{mode:'none',childId:model.childId}));render();tell('Liberação encerrada. As regras anteriores voltam a valer.');return;}
 if(a==='invite'){const r=await native('/api/parent/invite');dialog(`<h2>Convite para responsável</h2><p class="code">${escape(r.code)}</p><p>Válido por 10 minutos e usado uma vez. Quem receber poderá administrar todas as crianças desta família. Entregue somente ao outro responsável.</p>`);return;}
 if(a==='update'){await native('update');tell('Verificando a versão do painel…');}});
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,data=new FormData(form);run(async()=>{
 if(form.id==='rules'){const config={...model.config,limit:Number(data.get('limit')),enabled:data.has('enabled'),rest:data.has('rest'),start:parseTime(data.get('start')),end:parseTime(data.get('end'))};update(await native('/api/parent/config',{config,childId:model.childId}));render();tell('Regras salvas. Os aparelhos recebem na próxima sincronização.');}
 if(form.id==='task'){const id=form.dataset.id||('task-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),task={id,title:String(data.get('title')).trim(),minutes:Number(data.get('minutes'))};const tasks=[...model.config.tasks],index=tasks.findIndex(t=>t.id===id);if(index<0)tasks.push(task);else tasks[index]=task;update(await native('/api/parent/config',{config:{...model.config,tasks},childId:model.childId}));$('modal').close();render();}
 if(form.id==='release'){const mode=data.get('scope'),minutes=data.get('indefinite')==='on'?0:Number(data.get('minutes'));const apps=data.getAll('apps');if(mode==='apps'&&!apps.length)throw Error('Escolha pelo menos um aplicativo.');update(await native('/api/parent/release',{mode,minutes,apps,childId:model.childId}));$('modal').close();render();tell('Liberação salva. Aguarde a sincronização do aparelho.');}
 if(form.id==='pair'){const payload=Object.fromEntries(data);if(form.dataset.existing==='true')payload.childId=model.childId;update(await native('/api/pair',payload));$('modal').close();children=(await native('/api/parent/list')).children;view='children';render();tell('Aparelho vinculado.');}
 });});
async function boot(){try{model=await native('snapshot');if(model.role==='parent')children=(await native('/api/parent/list')).children;render();await run(refresh);}catch(e){tell(e.message);if(!model)$('content').innerHTML=button('Entrar','login','','wide spacer');}}
boot();
</script></body></html>
